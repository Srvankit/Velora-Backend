# ==========================================================
# VELORA MARKETS - BACKEND CONFIGURATION
# ==========================================================

spring.application.name=velora-backend


# ==========================================================
# SERVER
# ==========================================================

server.port=8080


# ==========================================================
# POSTGRESQL DATABASE
# ==========================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/velora_markets}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================================
# JPA / HIBERNATE
# ==========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ==========================================================
# HIKARI CONNECTION POOL
# ==========================================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# ==========================================================
# ERROR HANDLING
# ==========================================================

server.error.include-message=never
server.error.include-binding-errors=never


# ==========================================================
# LOGGING
# ==========================================================

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# ==========================================================
# JWT
# ==========================================================

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# ==========================================================
# CORS
# ==========================================================

app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}